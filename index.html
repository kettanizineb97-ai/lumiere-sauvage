<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Sauvage</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: #f5efe7;
      color: #1f2a56;
      font-family: Georgia, serif;
    }
  </style>
</head>

<body>

  <header class="flex justify-between items-center px-10 py-6 bg-[#f8f4ef]">

    <h1 class="text-3xl tracking-[0.3em]">
      LUMIÈRE SAUVAGE
    </h1>

    <nav class="flex gap-8 uppercase text-sm">
      <a href="#">La marque</a>
      <a href="#">Soins</a>
      <a href="#">Journal</a>
    </nav>

  </header>

  <section class="grid md:grid-cols-2 items-center px-10 py-20 gap-10">

    <div>

      <p class="uppercase tracking-[0.2em] text-sm mb-4">
        Cosmétique bio française
      </p>

      <h2 class="text-6xl leading-tight mb-6">
        La nature.
        <br>
        Notre source.
      </h2>

      <p class="text-lg leading-8 text-[#4d567a] mb-8">
        Des soins sensoriels inspirés des rituels botaniques,
        du luxe naturel et des senteurs méditerranéennes.
      </p>

      <button class="bg-[#1f2a56] text-white px-8 py-4 uppercase">
        Découvrir
      </button>

    </div>

    <div>

      <img
        src="https://images.unsplash.com/photo-1617897903246-719242758050?q=80&w=1200&auto=format&fit=crop"
        class="rounded-[30px] shadow-2xl"
      >

    </div>

  </section>

</body>

</html>
